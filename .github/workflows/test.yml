name: Tests and native build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Check shell syntax and build the native observer
        if: runner.os == 'macOS'
        run: |
          zsh -n src/session-themes.zsh
          sh -n scripts/install
          sh -n scripts/uninstall
          sh -n scripts/restore
          mkdir -p build
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -o build/session-themes-observer src/session-themes-observer.m
