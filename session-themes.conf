# Session themes: this is the central on/off switch and theme list.
# Commands in a new zsh shell: session-theme on | off | status | next | default
# on/off affects NEW sessions. Existing sessions keep their choice.
# session-theme live on | off controls the background appearance observer.
[settings]
enabled = true
# auto follows macOS immediately; light/dark pins the variant.
appearance = auto
# One background observer updates idle/busy terminals. false keeps the prompt fallback.
live_updates = true
show_status = true

# Each entry is: family = Dark theme name | Light theme name
# Entries rotate in this order, then repeat. Names are case-sensitive.
# Preview installed themes: ghostty +list-themes
# Check edits: session-theme validate
[pairs]
rose-pine = Rose Pine Moon | Rose Pine Dawn
catppuccin = Catppuccin Mocha | Catppuccin Latte
gruvbox = Gruvbox Dark | Gruvbox Light
flexoki = Flexoki Dark | Flexoki Light
tokyonight = TokyoNight Night | TokyoNight Day
solarized = iTerm2 Solarized Dark | iTerm2 Solarized Light
nord = Nord | Nord Light
melange = Melange Dark | Melange Light
everforest = Everforest Dark Hard | Everforest Light Med
modus = Modus Vivendi | Modus Operandi
